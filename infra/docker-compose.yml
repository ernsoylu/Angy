name: angy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: angy_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d angy_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Y.Doc hot cache — must run noeviction (CLAUDE.md gotcha); AOF smooths restarts
    image: redis:8-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    # Pre-creating the bucket dir replaces a one-shot mc init container,
    # which `docker compose up --wait` would misread as a failed service.
    entrypoint: /bin/sh -c "mkdir -p /data/angy-docs && exec minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Authentik
  # The workspace identity provider (ADR 0011). Server + worker is Authentik's
  # required split: the worker applies blueprints and runs background tasks,
  # the server only serves HTTP.
  #
  # It gets its own Postgres — Authentik owns its schema and runs its own
  # migrations, and sharing a database with Angy's Prisma migrations invites a
  # collision nobody wants to debug. Redis is shared on a separate DB index:
  # one fewer container, and `noeviction` suits both.
  authentik-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentikdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.8
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: dev-only-secret-key-change-me-in-any-real-deployment
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 1
      # Local dev is plain http; without this the login cookie is dropped.
      AUTHENTIK_COOKIE_SECURE: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      # 9000 is MinIO's and 8080 is a common local collision, so the IdP takes
      # 9010. OIDC_ISSUER_URL in .env.example matches.
      - "9010:9000"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.8
    command: worker
    environment:
      <<: *authentik-env
      # Applied only on the very first start; afterwards the akadmin password
      # is whatever you set in the UI.
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@acme.io
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  authentikdb:
  redisdata:
  meilidata:
  miniodata:
